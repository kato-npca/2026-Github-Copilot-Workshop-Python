<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Pomodoro Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="13" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M12 7v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M9 2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="logo-text">Pomodoro</span>
        </header>

        <main class="main">
            <section class="timer-card" aria-label="タイマー">
                <nav class="mode-tabs" role="tablist" aria-label="タイマーモード">
                    <button type="button" role="tab" data-mode="focus" aria-pressed="true">集中</button>
                    <button type="button" role="tab" data-mode="shortBreak" aria-pressed="false">短い休憩</button>
                    <button type="button" role="tab" data-mode="longBreak" aria-pressed="false">長い休憩</button>
                </nav>

                <div class="timer-ring-wrapper">
                    <svg class="timer-ring" viewBox="0 0 200 200" aria-hidden="true">
                        <circle class="timer-ring__track" cx="100" cy="100" r="90" />
                        <circle id="timer-ring-progress" class="timer-ring__progress" cx="100" cy="100" r="90"
                                stroke-dasharray="565.49" stroke-dashoffset="0"
                                transform="rotate(-90 100 100)" />
                    </svg>
                    <div class="timer-center">
                        <p id="timer-display" class="timer-display">25:00</p>
                        <p id="mode-label" class="mode-label">Focus</p>
                    </div>
                </div>

                <p id="session-status" class="status-badge" data-status="stopped">停止中</p>

                <div class="timer-actions">
                    <button id="start-button" type="button" class="btn btn--primary btn--lg">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <polygon points="5,3 17,10 5,17" />
                        </svg>
                        開始
                    </button>
                    <button id="pause-button" type="button" class="btn btn--secondary">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
                            <rect x="3" y="2" width="4" height="14" rx="1" />
                            <rect x="11" y="2" width="4" height="14" rx="1" />
                        </svg>
                        一時停止
                    </button>
                    <button id="reset-button" type="button" class="btn btn--ghost">リセット</button>
                </div>

                <p id="mode-description" class="mode-description">集中セッションを始める準備ができています。</p>
            </section>

            <aside class="info-panel">
                <div class="info-card">
                    <h2 class="info-card__title">セッション</h2>
                    <dl class="stat-grid">
                        <div class="stat">
                            <dt>周回</dt>
                            <dd id="cycle-count">0</dd>
                        </div>
                    </dl>
                </div>

                <div class="info-card">
                    <h2 class="info-card__title">設定</h2>
                    <ul class="setting-list" role="list">
                        <li><span>集中</span><strong id="focus-setting">25 分</strong></li>
                        <li><span>短い休憩</span><strong id="short-break-setting">5 分</strong></li>
                        <li><span>長い休憩</span><strong id="long-break-setting">15 分</strong></li>
                        <li><span>長い休憩まで</span><strong id="long-break-interval-setting">4 回</strong></li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
